<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진료 예약 목록</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>진료 예약 관리 시스템</h1>
    </header>

    <div class="card">
        <div class="card-header">
            <h2>진료 예약 목록</h2>
            <a href="/reservations/new" class="btn btn-primary">새 예약 추가</a>
        </div>

        <div class="card-body">
            <table id="reservationTable">
                <thead>
                <tr>
                    <th>예약 ID</th>
                    <th>의사 이름</th>
                    <th>환자 이름</th>
                    <th>환자 전화번호</th>
                    <th>시작 시간</th>
                    <th>종료 시간</th>
                    <th>예상 금액</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody id="reservationTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- 예약 취소 모달 -->
    <div id="cancellationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>예약 취소</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="cancellationForm">
                    <input type="hidden" id="cancellationReservationId" name="reservationId">
                    <div class="form-group">
                        <label for="cancelReason">취소 사유:</label>
                        <textarea id="cancelReason" name="cancelReason" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-danger">취소 확인</button>
                        <button type="button" class="btn btn-secondary close-form">돌아가기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        loadReservations();

        $(".close-modal, .close-form").click(function() {
            $(".modal").hide();
        });

        $("#cancellationForm").submit(function(e) {
            e.preventDefault();
            const reservationId = $("#cancellationReservationId").val();
            const cancelReason = $("#cancelReason").val();

            $.ajax({
                url: "/api/reservations/" + reservationId,
                type: "DELETE",
                contentType: "application/json",
                data: JSON.stringify({ cancelReason: cancelReason }),
                success: function() {
                    $("#cancellationModal").hide();
                    $("#cancellationForm")[0].reset();
                    loadReservations();
                    showNotification("예약이 취소되었습니다.", "success");
                },
                error: function(xhr) {
                    showNotification("예약 취소 실패: " + (xhr.responseJSON?.message || "알 수 없는 오류"), "error");
                }
            });
        });

        $(window).click(function(e) {
            if ($(e.target).hasClass("modal")) {
                $(".modal").hide();
            }
        });
    });

    function formatDateTime(date) {
        return date.getFullYear() + '-' +
            padNumber(date.getMonth() + 1) + '-' +
            padNumber(date.getDate()) + ' ' +
            padNumber(date.getHours()) + ':' +
            padNumber(date.getMinutes());
    }

    function padNumber(num) {
        return num.toString().padStart(2, '0');
    }

    function loadReservations() {
        $.ajax({
            url: "/api/reservations",
            type: "GET",
            success: function(reservations) {
                const tableBody = $("#reservationTableBody");
                tableBody.empty();

                if (reservations.length === 0) {
                    tableBody.append('<tr><td colspan="8" class="no-data">예약 내역이 없습니다.</td></tr>');
                    return;
                }

                reservations.forEach(function(res) {
                    const startTime = new Date(res.reservationStartTime);
                    const endTime = new Date(res.reservationEndTime);

                    const row = `
                        <tr>
                            <td>${res.id}</td>
                            <td>${res.doctorName}</td>
                            <td>${res.patientName}</td>
                            <td>${res.patientPhoneNumber}</td>
                            <td>${formatDateTime(startTime)}</td>
                            <td>${formatDateTime(endTime)}</td>
                            <td>${res.fee ? res.fee.toLocaleString() + "원" : "계산 불가"}</td>
                            <td>
                                <button class="btn btn-danger btn-sm cancel-reservation" data-id="${res.id}">
                                    취소
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.append(row);
                });

                $(".cancel-reservation").click(function() {
                    const reservationId = $(this).data("id");
                    $("#cancellationReservationId").val(reservationId);
                    $("#cancellationModal").show();
                });
            },
            error: function() {
                showNotification("예약 목록 불러오기 실패", "error");
            }
        });
    }

    function showNotification(message, type) {
        const notification = $("<div>").addClass("notification").addClass(type).text(message);
        $("body").append(notification);
        setTimeout(() => notification.fadeOut(() => notification.remove()), 3000);
    }
</script>
</body>
</html>
